id = "deyvideguilherme/prisma"
name = "Prisma Control Center"
version = "1.0.0"
plugin_api = 36
author = "Deyvide Guilherme"
license = "MIT"
dependencies = ["prisma-ctl"]
tags = ["display", "color", "gpu", "hardware", "amd"]
icon = "palette"
description = "Painel de controle visual de cores e monitoramento para placas de vídeo AMD no Noctalia Shell."

[[setting]]
key = "bar_metric"
type = "select"
label_key = "settings.bar_metric.label"
default = "hotspot"
description_key = "settings.bar_metric.description"
options = [
  { value = "hotspot", label_key = "settings.bar_metric.options.hotspot" },
  { value = "edge", label_key = "settings.bar_metric.options.edge" },
  { value = "gpu_busy", label_key = "settings.bar_metric.options.gpu_busy" },
]

[[setting]]
key = "hide_inactive"
type = "bool"
label_key = "settings.hide_inactive.label"
default = false
description_key = "settings.hide_inactive.description"

[[service]]
id = "service"
entry = "prisma_service.luau"

[[widget]]
id = "widget"
entry = "prisma_widget.luau"

[[shortcut]]
id = "shortcut"
entry = "prisma_shortcut.luau"

[[panel]]
id = "panel"
entry = "prisma_panel.luau"
width = 560
height = 680
placement = "attached"
position = "auto"
