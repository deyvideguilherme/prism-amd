PACKAGE_NAME="prism-amd"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="chroma_amd"
DEST_MODULE_LOCATION[0]="/kernel/drivers/gpu/drm/amd"
AUTOINSTALL="yes"

# Detect if target kernel was built with Clang/LLVM (e.g. CachyOS)
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \$(grep -qs 'CONFIG_CC_IS_CLANG=y' \${kernel_source_dir}/.config 2>/dev/null && echo 'LLVM=1') modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
